<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" />
  </head>
  <body>
    <header class="matrix-info">
      <img src="./eisenhower-matrix.jpg" alt="Eisenhower matrix" /><a
        class="more-info"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details?</a
      >
    </header>
    <main class="app">
      <div id="add-task-section">
        <label for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task" type="text" /><button type="button">
            Add
          </button>
        </div>
      </div>
      <h3>Todo</h3>
      <ul id="incompleteTasks">
        <li>
          <input type="checkbox" /><label class="task">Pay Bills</label
          ><input type="text" class="task" /><button type="button" class="edit">
            Edit</button
          ><button type="button" class="delete">
            <img src="./remove.svg" alt="" />
          </button>
        </li>
        <li>
          <input type="checkbox" /><label class="task">Go Shopping</label
          ><input type="text" class="task" /><button class="edit" type="button">
            Edit</button
          ><button type="button" class="delete">
            <img src="./remove.svg" alt="" />
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" checked /><label class="task"
            >See the Doctor</label
          ><input type="text" class="task" /><button type="button" class="edit">
            Edit</button
          ><button type="button" class="delete">
            <img src="./remove.svg" alt="" />
          </button>
        </li>
      </ul>
    </main>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
